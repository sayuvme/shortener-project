<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><div class="container mt-5" style="max-width:500px"><h2>Register</h2><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:errors="${form}"></div><form th:action="@{/register}" th:object="${form}" method="post"><label>Username</label><input th:field="*{username}" class="form-control"><div class="text-danger mb-2" th:errors="*{username}"></div><label>Email</label><input th:field="*{email}" class="form-control"><div class="text-danger mb-2" th:errors="*{email}"></div><label>Password</label><input type="password" th:field="*{password}" class="form-control"><div class="text-danger mb-3" th:errors="*{password}"></div><button class="btn btn-primary w-100">Register</button></form></div></body></html>
