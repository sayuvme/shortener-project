<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><div class="container mt-5" style="max-width:400px"><h2>Login</h2><div th:if="${param.error}" class="alert alert-danger">Invalid credentials</div><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><form th:action="@{/login}" method="post"><input name="username" class="form-control mb-3" placeholder="Username" required><input type="password" name="password" class="form-control mb-3" placeholder="Password" required><button class="btn btn-primary w-100">Login</button></form><p class="mt-3"><a href="/register">Register</a></p></div></body></html>
