<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="container mt-4"><h2>My links</h2><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><form th:action="@{/dashboard/links}" th:object="${form}" method="post" class="row g-2 mb-4"><div class="col-md-6"><input th:field="*{originalUrl}" class="form-control" placeholder="https://..."><div class="text-danger" th:errors="*{originalUrl}"></div></div><div class="col-md-4"><input th:field="*{tagsRaw}" class="form-control" placeholder="tags, comma, separated"></div><div class="col-md-2"><button class="btn btn-primary w-100">Shorten</button></div></form><input id="searchBox" class="form-control mb-3" placeholder="Search..."><table class="table table-striped" id="linksTable"><thead><tr><th>Code</th><th>URL</th><th>Tags</th><th>Actions</th></tr></thead><tbody><tr th:each="l : ${links.content}"><td><code th:text="${l.code}"></code></td><td><a th:href="${l.originalUrl}" th:text="${l.originalUrl}"></a></td><td><span th:each="t : ${l.tags}" class="badge bg-secondary me-1" th:text="${t.name}"></span></td><td><a th:href="@{'/dashboard/links/' + ${l.id} + '/stats'}" class="btn btn-sm btn-info">Stats</a> <a th:href="@{'/dashboard/links/' + ${l.id} + '/edit'}" class="btn btn-sm btn-warning">Edit</a> <form th:action="@{'/dashboard/links/' + ${l.id} + '/delete'}" method="post" class="d-inline"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr></tbody></table><nav><ul class="pagination"><li class="page-item" th:classappend="${links.first} ? 'disabled'"><a class="page-link" th:href="@{/dashboard/links(page=${links.number - 1})}">Prev</a></li><li class="page-item disabled"><span class="page-link" th:text="${links.number + 1} + ' / ' + ${links.totalPages}"></span></li><li class="page-item" th:classappend="${links.last} ? 'disabled'"><a class="page-link" th:href="@{/dashboard/links(page=${links.number + 1})}">Next</a></li></ul></nav></main><script src="/js/links.js"></script></body></html>
