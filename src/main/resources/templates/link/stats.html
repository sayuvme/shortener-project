<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><div class="container mt-4"><h2>Stats for <code th:text="${link.code}"></code></h2><p><a th:href="${link.originalUrl}" th:text="${link.originalUrl}"></a></p><p>Total clicks: <b th:text="${clicks.totalElements}"></b></p><table class="table table-sm"><thead><tr><th>#</th><th>Time</th><th>IP</th><th>Country</th><th>City</th></tr></thead><tbody><tr th:each="c,it : ${clicks.content}"><td th:text="${it.index + 1}"></td><td th:text="${c.clickedAt}"></td><td th:text="${c.ip}"></td><td th:text="${c.country}"></td><td th:text="${c.city}"></td></tr></tbody></table><a href="/dashboard/links" class="btn btn-secondary">Back</a></div></body></html>
